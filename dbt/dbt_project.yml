name: olist
version: "1.0.0"
profile: olist

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  olist:
    # Nessie (Iceberg catalog) không hỗ trợ CREATE VIEW trên Trino,
    # nên staging/intermediate materialize thành table thay vì view.
    staging:
      +materialized: table
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
