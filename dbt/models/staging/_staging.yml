version: 2

models:
  - name: stg_orders
    description: Đơn hàng, timestamp đã cast. 1 dòng = 1 đơn.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              values: [delivered, shipped, canceled, unavailable,
                       invoiced, processing, created, approved]

  - name: stg_order_items
    description: Dòng item trong đơn. Grain = (order_id, order_item_id).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: price
        description: Giá bán 1 item, luôn >= 0 (refund không nằm ở bảng này).
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: stg_order_payments
    description: Thanh toán theo đơn. Có đơn nhiều dòng (trả góp/nhiều phương thức).
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_type
        tests:
          - accepted_values:
              values: [credit_card, boleto, voucher, debit_card, not_defined]

  - name: stg_order_reviews
    description: Đánh giá đơn. review_id có thể lặp (1 review cho nhiều đơn gộp).
    columns:
      - name: review_score
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false

  - name: stg_customers
    description: Khách theo từng đơn. customer_id unique; customer_unique_id là người thật.
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_unique_id
        tests: [not_null]

  - name: stg_products
    description: Sản phẩm, category đã dịch sang tiếng Anh.
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_sellers
    description: Người bán.
    columns:
      - name: seller_id
        tests: [unique, not_null]
