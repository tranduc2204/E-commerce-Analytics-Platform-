name: olist-lakehouse

services:
  # ---------- Object storage ----------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tạo prefix lake/raw + lake/raw-meta (file metastore) + lake/warehouse rồi thoát
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LAKE_BUCKET: ${LAKE_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$LAKE_BUCKET/raw local/$$LAKE_BUCKET/raw-meta local/$$LAKE_BUCKET/warehouse;
      exit 0"

  # ---------- Postgres: 3 database cho nessie / airflow / metabase ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Nessie (Iceberg catalog — thay Hive Metastore cho vùng curated) ----------
  # Version store dùng JDBC → Postgres (db nessie_db), persist qua restart.
  # Vùng raw (hive connector) không cần service này: nó dùng file-based metastore trên MinIO.
  nessie:
    image: ghcr.io/projectnessie/nessie:0.108.0
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC
      NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE: postgresql
      QUARKUS_DATASOURCE_POSTGRESQL_DB_KIND: postgresql
      QUARKUS_DATASOURCE_POSTGRESQL_JDBC_URL: jdbc:postgresql://postgres:5432/nessie_db
      QUARKUS_DATASOURCE_POSTGRESQL_USERNAME: ${POSTGRES_USER}
      QUARKUS_DATASOURCE_POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "19120:19120"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- Trino (query engine) ----------
  trino:
    image: trinodb/trino:470
    ports:
      - "8080:8080"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./docker/trino/etc:/etc/trino:ro
      - ./sql:/sql:ro
    depends_on:
      nessie:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # ---------- Airflow (standalone: webserver + scheduler trong 1 container) ----------
  airflow:
    build: ./docker/airflow
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      # code dùng chung nhìn thấy hạ tầng qua hostname nội bộ docker
      PYTHONPATH: /opt/airflow/repo
      DBT_PROFILES_DIR: /opt/airflow/repo/dbt
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LAKE_BUCKET: ${LAKE_BUCKET}
      TRINO_HOST: trino
      TRINO_PORT: 8080
      TRINO_USER: airflow
      DATA_DIR: /opt/airflow/repo/data
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./utils:/opt/airflow/repo/utils
      - ./extract:/opt/airflow/repo/extract
      - ./dbt:/opt/airflow/repo/dbt
      - ./data:/opt/airflow/repo/data
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_started

  # ---------- Metabase (BI) ----------
  # Cần driver Trino (Starburst): tải jar vào docker/metabase/plugins — xem README
  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_db
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
    volumes:
      - ./docker/metabase/plugins:/plugins
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  minio-data:
  pg-data:
