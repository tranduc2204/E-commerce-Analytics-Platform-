name: olist-lakehouse

services:
  # ---------- Object storage ----------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tạo bucket lake/raw + lake/warehouse rồi thoát
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LAKE_BUCKET: ${LAKE_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$LAKE_BUCKET/raw local/$$LAKE_BUCKET/warehouse;
      exit 0"

  # ---------- Postgres: 3 database cho metastore / airflow / metabase ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Hive Metastore (catalog cho cả hive raw lẫn iceberg) ----------
  hive-metastore:
    image: starburstdata/hive:3.1.2-e.18
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://postgres:5432/metastore_db
      HIVE_METASTORE_USER: ${POSTGRES_USER}
      HIVE_METASTORE_PASSWORD: ${POSTGRES_PASSWORD}
      HIVE_METASTORE_WAREHOUSE_DIR: s3://${LAKE_BUCKET}/warehouse
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_PATH_STYLE_ACCESS: "true"
      # image này bắt buộc khai báo các biến cloud khác dù không dùng
      REGION: ""
      GOOGLE_CLOUD_KEY_FILE_PATH: ""
      AZURE_ADL_CLIENT_ID: ""
      AZURE_ADL_CREDENTIAL: ""
      AZURE_ADL_REFRESH_URL: ""
      AZURE_ABFS_STORAGE_ACCOUNT: ""
      AZURE_ABFS_ACCESS_KEY: ""
      AZURE_WASB_STORAGE_ACCOUNT: ""
      AZURE_ABFS_OAUTH: ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_WASB_ACCESS_KEY: ""
    ports:
      - "9083:9083"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # ---------- Trino (query engine) ----------
  trino:
    image: trinodb/trino:470
    ports:
      - "8080:8080"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./docker/trino/etc:/etc/trino:ro
      - ./sql:/sql:ro
    depends_on:
      hive-metastore:
        condition: service_started

  # ---------- Airflow (standalone: webserver + scheduler trong 1 container) ----------
  airflow:
    build: ./docker/airflow
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      # code dùng chung nhìn thấy hạ tầng qua hostname nội bộ docker
      PYTHONPATH: /opt/airflow/repo
      DBT_PROFILES_DIR: /opt/airflow/repo/dbt
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LAKE_BUCKET: ${LAKE_BUCKET}
      TRINO_HOST: trino
      TRINO_PORT: 8080
      TRINO_USER: airflow
      DATA_DIR: /opt/airflow/repo/data
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./utils:/opt/airflow/repo/utils
      - ./extract:/opt/airflow/repo/extract
      - ./dbt:/opt/airflow/repo/dbt
      - ./data:/opt/airflow/repo/data
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_started

  # ---------- Metabase (BI) ----------
  # Cần driver Trino (Starburst): tải jar vào docker/metabase/plugins — xem README
  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_db
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
    volumes:
      - ./docker/metabase/plugins:/plugins
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  minio-data:
  pg-data:
