# Catalog "raw": hive connector đọc parquet thô do extract/replay.py ghi lên MinIO.
# Raw zone bất biến — Trino chỉ đọc, không ghi (trừ DDL đăng ký bảng external).
connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083
hive.storage-format=PARQUET
hive.non-managed-table-writes-enabled=false
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
