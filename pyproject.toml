[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-lakehouse"
version = "1.0.0"
description = "E-commerce Analytics Platform — ELT lakehouse trên dataset Olist (MinIO + Iceberg + Trino + dbt + Airflow + Metabase)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "boto3>=1.34",
    "trino>=0.330",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Tải dataset từ Kaggle
extract = ["kaggle>=1.6"]
# Transform layer — chạy ở host khi muốn dbt build ngoài container
dbt = ["dbt-trino>=1.8,<2.0"]
# Dev/test: unit + DAG integrity. Airflow cần cho airflow/tests.
dev = [
    "pytest>=8.0",
    "apache-airflow==2.10.4",
]

[tool.setuptools]
# Chỉ hai package này là code Python import được; airflow/ và tests/ không phải package cài đặt.
packages = ["utils", "extract"]

[tool.pytest.ini_options]
# pythonpath=. để import utils/extract mà không cần pip install -e .
pythonpath = ["."]
testpaths = ["tests", "airflow/tests"]
markers = [
    "integration: test cần hạ tầng (docker compose up) — mặc định bị loại trừ",
]
# `pytest` trần → bỏ qua integration; `pytest -m integration` ghi đè để chạy chúng.
addopts = "-ra -m 'not integration'"
